<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống Quản lý Thư viện</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .login-header h2 {
            font-size: 24px;
            color: #1e293b;
            margin-bottom: 8px;
        }
        .login-header p {
            color: #64748b;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #334155;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #2563eb;
        }
        .alert-error {
            display: none;
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 18px;
            border: 1px solid #fecaca;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h2>Quản Lý Thư Viện</h2>
            <p>Đăng nhập hệ thống để tiếp tục</p>
        </div>

        <div id="errorAlert" class="alert-error"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" required placeholder="Nhập tên đăng nhập">
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" required placeholder="Nhập mật khẩu">
            </div>

            <button type="submit" class="btn-submit" id="loginBtn">Đăng nhập</button>
        </form>
    </div>

    <script>
        const API_LOGIN = "http://localhost:8080/api/auth/login";

        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const errorAlert = document.getElementById("errorAlert");
            const loginBtn = document.getElementById("loginBtn");

            errorAlert.style.display = "none";
            loginBtn.innerText = "Đang xử lý...";
            loginBtn.disabled = true;

            try {
                const response = await fetch(API_LOGIN, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => null);
                    throw new Error(errorData?.message || "Tên đăng nhập hoặc mật khẩu không đúng!");
                }

                const data = await response.json();

                // 1. Lưu Token và thông tin User vào localStorage của trình duyệt
                localStorage.setItem("token", data.token);
                localStorage.setItem("currentUser", JSON.stringify(data.user));

                // 2. Điều hướng theo quyền (Role)
                if (data.user.role === "ADMIN") {
                    alert(`Đăng nhập thành công với quyền ADMIN (${data.user.username})`);
                    window.location.href = "borrow/borrows.html"; // hoặc dashboard.html
                } else {
                    alert(`Đăng nhập thành công với quyền THỦ THƯ (${data.user.username})`);
                    window.location.href = "borrow/borrows.html";
                }

            } catch (error) {
                errorAlert.innerText = error.message;
                errorAlert.style.display = "block";
            } finally {
                loginBtn.innerText = "Đăng nhập";
                loginBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
