<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Độc giả - Quản Lý Thư Viện</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; width: 100%; max-width: 440px; padding: 35px 30px; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); position: relative; }
        .btn-back { display: inline-flex; align-items: center; gap: 5px; color: #64748b; text-decoration: none; font-size: 14px; font-weight: bold; margin-bottom: 20px; }
        .btn-back:hover { color: #2563eb; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { font-size: 24px; color: #1e293b; margin-bottom: 8px; }
        .header p { color: #64748b; font-size: 14px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; color: #334155; }
        .form-group input { width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #2563eb; }
        .alert { display: none; padding: 12px 14px; border-radius: 6px; font-size: 14px; margin-bottom: 18px; line-height: 1.5; }
        .alert-error { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
        .alert-success { background-color: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .btn-submit { width: 100%; padding: 12px; background-color: #10b981; color: #ffffff; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-submit:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div class="card">
        <!-- NÚT QUAY LẠI -->
        <a href="login.html" class="btn-back">← Quay lại Đăng nhập</a>

        <div class="header">
            <h2>Đăng Ký Độc Giả</h2>
            <p>Tạo tài khoản để đăng ký mượn sách thư viện</p>
        </div>

        <div id="errorAlert" class="alert alert-error"></div>
        <div id="successAlert" class="alert alert-success"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" required placeholder="Ví dụ: nguyenvana">
            </div>

            <div class="form-group">
                <label for="email">Địa chỉ Email</label>
                <input type="email" id="email" required placeholder="Ví dụ: nguyenvana@gmail.com">
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" required placeholder="Nhập mật khẩu">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" required placeholder="Nhập lại mật khẩu">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Xác nhận Đăng ký</button>
        </form>
    </div>

    <script>
        const API_REGISTER = "http://localhost:8080/api/auth/register";

        async function handleRegister(event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            const errorAlert = document.getElementById("errorAlert");
            const successAlert = document.getElementById("successAlert");
            const submitBtn = document.getElementById("submitBtn");

            errorAlert.style.display = "none";
            successAlert.style.display = "none";

            if (password !== confirmPassword) {
                errorAlert.innerText = "Mật khẩu xác nhận không khớp!";
                errorAlert.style.display = "block";
                return;
            }

            submitBtn.innerText = "Đang xử lý...";
            submitBtn.disabled = true;

            try {
                const response = await fetch(API_REGISTER, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, email, password })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => null);
                    throw new Error(errData?.message || "Đăng ký không thành công!");
                }

                document.getElementById("registerForm").reset();
                successAlert.innerHTML = `<strong>Đăng ký thành công!</strong><br>Tài khoản đang chờ Quản trị viên duyệt. Sau khi duyệt, bạn có thể đăng nhập ngay.`;
                successAlert.style.display = "block";

            } catch (error) {
                errorAlert.innerText = error.message;
                errorAlert.style.display = "block";
            } finally {
                submitBtn.innerText = "Xác nhận Đăng ký";
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
